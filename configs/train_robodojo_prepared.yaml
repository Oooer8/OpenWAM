defaults:
- train
- override dataloader: robodojo_prepared
- _self_
training:
  debug: false
  learning_rate: 0.0001
  adam_betas:
  - 0.9
  - 0.95
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_epochs: null
  max_steps: 60000
  batch_size: 4
  gradient_accumulation_steps: 1
  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null
  mixed_precision: bf16
  zero_stage: 2
  use_gradient_checkpointing: false
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: false
  offload_optimizer_device: none
  lambda_video: 1.0
  lambda_action: 1.0
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  output_path: /mnt/vepfs01/output/tiecheng.guo/openwam/outputs/robodojo_alpha_prepared
  save_steps: 2000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 10
  finetune_ckpt_path: /mnt/vepfs01/output/tiecheng.guo/openwam/assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Pretrain-Foundation-Model
  resume_ckpt_path: null
  dataset_num_workers: 8
model:
  architecture:
    framework: dual_system
    variant: joint_self_attn
    action_dim: 80
    use_proprioception: true
    state_dim: 80
    bridge_layers: null
    bridge_interval: 1
    mot_checkpoint_mixed_attn: true
    attention_mask_mode: mutual
    video_attention_mask_mode: first_frame_causal
    detach_bridge: false
    idm_video_cond_noise_prob: 0.5
project:
  name: openwam
  seed: 42
  wandb:
    run_name: robodojo_alpha_prepared
